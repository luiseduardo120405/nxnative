name: nxnative - .nup (artefacto) a IPA

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID que contiene el artefacto nup-file (vacío = el más reciente no expirado)"
        required: false
        default: ""
      expected_sha256:
        description: "SHA-256 esperado del .nup (vacío = no comprobar)"
        required: false
        default: ""
      min_size_mb:
        description: "Tamaño mínimo esperado del .nup (MB)"
        required: true
        default: "50"
      build_script:
        description: "Script de build (vacío = scripts/build_ipa_from_nsp.py o engine/scripts/...)"
        required: false
        default: ""
      extra_args:
        description: "Argumentos extra para el script (ej: --romfs separate)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '' }}
  EXPECTED_SHA256: ${{ github.event.inputs.expected_sha256 || '' }}
  MIN_SIZE_MB: ${{ github.event.inputs.min_size_mb || '50' }}
  BUILD_SCRIPT: ${{ github.event.inputs.build_script || '' }}
  EXTRA_ARGS: ${{ github.event.inputs.extra_args || '' }}
  ARTIFACT_NAME: nup-file
  GAME_DIR: ${{ github.workspace }}/_game
  OUT_FILE: game.nup

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- ENTORNO ----------
      - name: Info del runner y espacio en disco
        run: |
          sw_vers
          xcodebuild -version || true
          ls -d /Applications/Xcode*.app || true
          df -h /

      - name: Seleccionar el Xcode más reciente
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Liberar espacio (simuladores y caches)
        run: |
          sudo rm -rf ~/Library/Developer/CoreSimulator/Devices/* 2>/dev/null || true
          xcrun simctl delete all 2>/dev/null || true
          brew cleanup -s 2>/dev/null || true
          df -h /

      - name: Instalar herramientas de build
        run: |
          if [ -f Brewfile ]; then
            brew bundle --file=Brewfile
          else
            brew install xcodegen zstd spirv-cross glslang
            brew install --cask dotnet-sdk || true
          fi
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install capstone lz4 fonttools
          fi

      # ---------- OBTENER .NUP DESDE ARTEFACTO ----------
      - name: Localizar artefacto nup-file
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if [ -n "$SOURCE_RUN_ID" ]; then
            RUN_ID="$SOURCE_RUN_ID"
          else
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No hay ningún artefacto '${ARTIFACT_NAME}' vigente (los artefactos expiran a los 7 días o según tu retención)."
            gh api "repos/${{ github.repository }}/actions/artifacts?per_page=30" \
              --jq '.artifacts[] | "\(.name)  expired=\(.expired)  run=\(.workflow_run.id)  \(.created_at)"' || true
            exit 1
          fi
          echo "Usando run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Descargar artefacto nup-file
        uses: actions/download-artifact@v4
        with:
          name: nup-file
          path: _game
          github-token: ${{ github.token }}
          run-id: ${{ steps.find.outputs.run_id }}
          repository: ${{ github.repository }}

      - name: Verificar .nup (tamaño, formato, SHA-256)
        run: |
          set -eo pipefail
          echo "Contenido descargado:"; ls -lh "$GAME_DIR"

          # El artefacto puede tener otro nombre de archivo: localizar el .nup
          FOUND=$(find "$GAME_DIR" -type f -iname "*.nup" -print -quit)
          [ -n "$FOUND" ] || { echo "::error::No hay ningún .nup dentro del artefacto"; exit 1; }
          if [ "$FOUND" != "$GAME_DIR/$OUT_FILE" ]; then
            mv "$FOUND" "$GAME_DIR/$OUT_FILE"
          fi

          F="$GAME_DIR/$OUT_FILE"
          SIZE=$(stat -f%z "$F")
          MIN=$(( MIN_SIZE_MB * 1024 * 1024 ))
          echo "Tamaño: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          [ "$SIZE" -ge "$MIN" ] || { echo "::error::Archivo demasiado pequeño"; head -c 500 "$F"; exit 1; }
          if head -c 512 "$F" | grep -qiE "<html|<!doctype"; then
            echo "::error::El archivo es HTML (artefacto de una descarga fallida de Drive)"; exit 1
          fi

          ACTUAL=$(shasum -a 256 "$F" | cut -d' ' -f1)
          echo "SHA256 calculado: $ACTUAL"
          EXPECTED="${EXPECTED_SHA256#sha256:}"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SHA-256 distinto. Esperado: $EXPECTED"
            exit 1
          fi
          df -h /

      # ---------- COMPILACIÓN ----------
      - name: Instalar módulos de Python requeridos por el script
        run: |
          set -eo pipefail
          source .venv/bin/activate
          python --version
          pip install --upgrade pip
          pip install zbit "capstone>=5,<6" fonttools zstandard
          # backports.zstd solo existe/aplica en Python < 3.14; si no se puede instalar, se avisa y se sigue
          pip install backports.zstd || echo "::warning::backports.zstd no se pudo instalar (¿Python >= 3.14?)"
          pip list | grep -iE "zbit|capstone|fonttools|zstandard|zstd" || true
          python -c "import zbit, capstone, fontTools, zstandard; print('módulos OK')"

      - name: Compilar IPA con nxnative
        run: |
          set -eo pipefail
          source .venv/bin/activate

          if [ -n "$BUILD_SCRIPT" ]; then
            SCRIPT="$BUILD_SCRIPT"
          elif [ -f scripts/build_ipa_from_nsp.py ]; then
            SCRIPT=scripts/build_ipa_from_nsp.py
          elif [ -f engine/scripts/build_ipa_from_nsp.py ]; then
            SCRIPT=engine/scripts/build_ipa_from_nsp.py
          else
            echo "::error::No encontré build_ipa_from_nsp.py. Indica build_script."
            find . -name "*.py" -path "*scripts*" -maxdepth 3 | head -30
            exit 1
          fi
          echo "Script: $SCRIPT"

          # Los .nup (Switch 2) no necesitan prod.keys.
          # Si tu juego sí los necesita, añade el secret PROD_KEYS_B64 (base64 de prod.keys).
          KEYS_ARG=""
          if [ -n "${PROD_KEYS_B64:-}" ]; then
            echo "$PROD_KEYS_B64" | base64 --decode > "$RUNNER_TEMP/prod.keys"
            KEYS_ARG="-k $RUNNER_TEMP/prod.keys"
          fi

          # El script escribe el IPA en la misma carpeta que la entrada
          python3 "$SCRIPT" "$GAME_DIR/$OUT_FILE" $KEYS_ARG $EXTRA_ARGS
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}

      # ---------- RESULTADO ----------
      - name: Localizar y verificar IPA
        run: |
          set -eo pipefail
          mkdir -p dist
          IPA=$(find "$GAME_DIR" -maxdepth 2 -name "*.ipa" -print -quit)
          [ -n "$IPA" ] || { echo "::error::No se generó ningún .ipa"; find "$GAME_DIR" -maxdepth 2 | head -40; exit 1; }
          cp "$IPA" dist/
          ls -lh dist/
          echo "Contenido: $(unzip -l dist/*.ipa | tail -1)"
          df -h /

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/*.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Subir logs de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: _game/_build/**/*.log
          if-no-files-found: ignore
          retention-days: 7

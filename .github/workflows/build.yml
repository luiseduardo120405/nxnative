name: Build Switch 2 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          brew install xcodegen zstd glslang
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic

      - name: Download ROM from Google Drive
        run: |
          mkdir -p game_rom
          curl -L "https://drive.google.com/uc?export=download&id=1ch_DMA-ElCVMPFk000NtN63FMqabQCP" -o game_rom/zelda.nup

      - name: Build IPA
        run: |
          python3 scripts/build_ipa_from_nsp.py game_rom/zelda.nup --output build_output

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zelda-Remake-iOS
          path: build_output/*.ipa

name: nxnative - .nup (artefacto) a IPA

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID con el artefacto nup-file (vacío = el más reciente no expirado)"
        required: false
        default: ""
      expected_sha256:
        description: "SHA-256 esperado del .nup (vacío = no comprobar)"
        required: false
        default: ""
      min_size_mb:
        description: "Tamaño mínimo esperado del .nup (MB)"
        required: true
        default: "50"
      build_script:
        description: "Script de build (vacío = scripts/build_ipa_from_nsp.py o engine/scripts/...)"
        required: false
        default: ""
      extra_args:
        description: "Argumentos extra del script (ej: --allow-other-metal --romfs separate)"
        required: false
        default: "--allow-other-metal"

permissions:
  contents: read
  actions: read

# Evita dos builds de 25 GB a la vez
concurrency:
  group: nxnative-build
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '' }}
  EXPECTED_SHA256: ${{ github.event.inputs.expected_sha256 || '' }}
  MIN_SIZE_MB: ${{ github.event.inputs.min_size_mb || '50' }}
  BUILD_SCRIPT: ${{ github.event.inputs.build_script || '' }}
  EXTRA_ARGS: ${{ github.event.inputs.extra_args || '--allow-other-metal' }}
  ARTIFACT_NAME: nup-file
  GAME_DIR: ${{ github.workspace }}/_game
  OUT_FILE: game.nup

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- ENTORNO ----------
      - name: Seleccionar Xcode más reciente y liberar espacio
        run: |
          sw_vers
          df -h /

          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST/Contents/Developer"
            # Borrar las demás versiones de Xcode libera decenas de GB
            for X in /Applications/Xcode_*.app; do
              [ "$X" != "$LATEST" ] && sudo rm -rf "$X"
            done
          fi
          xcodebuild -version

          sudo rm -rf ~/Library/Developer/CoreSimulator/Devices/* 2>/dev/null || true
          xcrun simctl runtime delete all 2>/dev/null || true
          brew cleanup -s 2>/dev/null || true
          df -h /

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas y módulos de Python
        run: |
          set -eo pipefail
          if [ -f Brewfile ]; then
            brew bundle --file=Brewfile
          else
            brew install xcodegen zstd spirv-cross glslang
            brew install --cask dotnet-sdk || true
          fi

          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt

          # Versiones que pide el script (el paquete de PyPI es zbic, no zbit)
          pip install zbic "capstone>=5,<6" fonttools zstandard lz4
          pip install backports.zstd || echo "::warning::backports.zstd no se pudo instalar"

          python --version
          pip list | grep -iE "zbic|capstone|fonttools|zstandard|zstd|lz4" || true
          python -c "import zbic, capstone, fontTools, zstandard; print('módulos OK')"

      # ---------- OBTENER .NUP DESDE ARTEFACTO ----------
      - name: Localizar artefacto nup-file
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if [ -n "$SOURCE_RUN_ID" ]; then
            RUN_ID="$SOURCE_RUN_ID"
          else
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No hay ningún artefacto '${ARTIFACT_NAME}' vigente (expiran según la retención)."
            gh api "repos/${{ github.repository }}/actions/artifacts?per_page=30" \
              --jq '.artifacts[] | "\(.name)  expired=\(.expired)  run=\(.workflow_run.id)  \(.created_at)"' || true
            exit 1
          fi
          echo "Usando run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Descargar artefacto nup-file
        uses: actions/download-artifact@v4
        with:
          name: nup-file
          path: _game
          github-token: ${{ github.token }}
          run-id: ${{ steps.find.outputs.run_id }}
          repository: ${{ github.repository }}

      - name: Verificar .nup (tamaño, formato, SHA-256)
        run: |
          set -eo pipefail
          ls -lh "$GAME_DIR"

          FOUND=$(find "$GAME_DIR" -type f -iname "*.nup" -print -quit)
          [ -n "$FOUND" ] || { echo "::error::No hay ningún .nup dentro del artefacto"; exit 1; }
          [ "$FOUND" = "$GAME_DIR/$OUT_FILE" ] || mv "$FOUND" "$GAME_DIR/$OUT_FILE"

          F="$GAME_DIR/$OUT_FILE"
          SIZE=$(stat -f%z "$F")
          MIN=$(( MIN_SIZE_MB * 1024 * 1024 ))
          echo "Tamaño: $SIZE bytes ($(( SIZE / 1024 / 1024 )) MB)"
          [ "$SIZE" -ge "$MIN" ] || { echo "::error::Archivo demasiado pequeño"; head -c 500 "$F"; exit 1; }
          if head -c 512 "$F" | grep -qiE "<html|<!doctype"; then
            echo "::error::El archivo es HTML (descarga fallida de Drive)"; exit 1
          fi

          ACTUAL=$(shasum -a 256 "$F" | cut -d' ' -f1)
          echo "SHA256 calculado: $ACTUAL"
          EXPECTED="${EXPECTED_SHA256#sha256:}"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SHA-256 distinto. Esperado: $EXPECTED"; exit 1
          fi
          df -h /

      # ---------- COMPILACIÓN ----------
      - name: Localizar script y mostrar sus opciones
        run: |
          source .venv/bin/activate
          if [ -n "$BUILD_SCRIPT" ]; then
            SCRIPT="$BUILD_SCRIPT"
          elif [ -f scripts/build_ipa_from_nsp.py ]; then
            SCRIPT=scripts/build_ipa_from_nsp.py
          elif [ -f engine/scripts/build_ipa_from_nsp.py ]; then
            SCRIPT=engine/scripts/build_ipa_from_nsp.py
          else
            echo "::error::No encontré build_ipa_from_nsp.py. Indica build_script."
            find . -name "*.py" -path "*scripts*" -maxdepth 3 | head -30
            exit 1
          fi
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "Script: $SCRIPT"
          python "$SCRIPT" --help 2>&1 | head -80 || true

      - name: Compilar IPA con nxnative
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          set -eo pipefail
          source .venv/bin/activate

          # Los .nup de Switch 2 no necesitan prod.keys.
          # Si tu juego sí, añade el secret PROD_KEYS_B64 (base64 de prod.keys).
          KEYS_ARG=""
          if [ -n "${PROD_KEYS_B64:-}" ]; then
            echo "$PROD_KEYS_B64" | base64 --decode > "$RUNNER_TEMP/prod.keys"
            KEYS_ARG="-k $RUNNER_TEMP/prod.keys"
          fi

          # El script escribe el IPA en la misma carpeta que la entrada
          python "$SCRIPT" "$GAME_DIR/$OUT_FILE" $KEYS_ARG $EXTRA_ARGS

      # ---------- RESULTADO ----------
      - name: Localizar y verificar IPA
        run: |
          set -eo pipefail
          mkdir -p dist
          IPA=$(find "$GAME_DIR" -maxdepth 2 -name "*.ipa" -print -quit)
          [ -n "$IPA" ] || { echo "::error::No se generó ningún .ipa"; find "$GAME_DIR" -maxdepth 2 | head -40; exit 1; }
          cp "$IPA" dist/
          ls -lh dist/
          ENTRIES=$(unzip -l dist/*.ipa | tail -1)
          echo "Contenido: $ENTRIES"
          {
            echo "### IPA generado"
            echo "- Archivo: \`$(basename "$IPA")\`"
            echo "- Tamaño: $(du -h dist/*.ipa | cut -f1)"
            echo "- Contenido del zip: $ENTRIES"
            echo "- Firmar antes de instalar (AltStore, SideStore, etc.)"
          } >> "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/*.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Subir logs de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            _game/**/*.log
            _game/*_build/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
